services:
  postgres:
    build: ./infra/postgres
    container_name: postgres_musicabi
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_musicabi
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: musicabi@sysbi.com
      PGADMIN_DEFAULT_PASSWORD: musicabi
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend

  airflow:
    build: ./infra/airflow
    container_name: airflow_musicabi
    restart: always
    command: standalone
    environment:
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      # Make etl package importable from the mounted volume
      PYTHONPATH: /opt/airflow
      # Override localhost → docker service name so dlt can reach Postgres from inside the container
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./.dlt/config.toml:/home/airflow/.dlt/config.toml:ro
      - ./.dlt/secrets.toml:/home/airflow/.dlt/secrets.toml:ro
      - dlt_pipelines:/home/airflow/.dlt/pipelines
      - airflow_logs:/opt/airflow/logs
      - airflow_db:/opt/airflow
    networks:
      - backend
    depends_on:
      - postgres

volumes:
  postgres_data:
  airflow_logs:
  airflow_db:
  dlt_pipelines:

networks:
  backend: